# 무엇을 어디에 배포할지 (모든 기기 공통).
# 이 기기만의 차이는 config.local.toml 에 적는다(커밋 안 함). 예시는 config.local.example.toml.

[targets]
claude_home = "~/.claude"
agents_home = "~/.agents"   # Codex 스킬 착지점 (~/.agents/skills)

[skills]
platforms = ["claude", "codex"]
items = [
  "session-handoff",
  "youtube-to-obsidian",
  "collecting-zoom-clips",
  "grill",
  # Claude 에서는 settings.json skillOverrides 로 꺼 둔 스킬이다. Codex 는 그 설정을 모르니 Codex 에는 배포하지 않는다.
  { name = "design-compare", platforms = ["claude"] },
]

[rules]
# 공유 위키 규칙은 여기 두지 않는다. 연결 지점은 ~/.claude/CLAUDE.md · ~/.codex/AGENTS.md 의
# SHARED-LLM-WIKI 블록이다(위키 README 의 설치·되돌리기 절차가 이 블록 기준).
items = ["vocabulary", "verification", "troubleshooting-log", "writing", "korean-style", "korean-style-toss"]
platforms = ["claude"]

# 낱개 파일. settings.json 이 가리키는 자리에 링크를 건다.
[[files]]
src = "statusline/statusline.py"
dest = "~/.claude/statusline.py"

# 공유 LLM Wiki 훅 — Claude settings.json 과 Codex hooks.json 이 둘 다 이 자리를 부른다 (2026-10-20)
[[files]]
src = "hooks/wiki_log_guard.py"
dest = "~/.claude/hooks/wiki_log_guard.py"

[[files]]
src = "tools/wiki_sync.py"
dest = "~/.claude/hooks/wiki_sync.py"

# 한국어 문체 지침 훅. Codex hooks.json 이 이 자리를 부른다(tools/korean_style_hooks.py 로 등록). Claude 는 [rules] 로 읽는다 (2026-10-27)
[[files]]
src = "hooks/korean_style_context.py"
dest = "~/.claude/hooks/korean_style_context.py"

# 문체 검사 Stop 훅. Claude settings.json · Codex hooks.json 이 이 자리를 부른다(tools/korean_style_hooks.py 로 등록) (2026-10-27)
[[files]]
src = "hooks/korean_style_guard.py"
dest = "~/.claude/hooks/korean_style_guard.py"
